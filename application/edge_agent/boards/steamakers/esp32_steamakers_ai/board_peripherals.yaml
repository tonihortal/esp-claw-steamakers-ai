version: 1.0.0

# ESP32 STEAMakers AI / Keyestudio KS5034 peripherals.
peripherals:
  # MAX98357A speaker amplifier (I2S1 standard TX).
  - name: i2s_audio_out
    type: i2s
    role: master
    format: std-out
    config:
      port: 1
      sample_rate_hz: 24000
      mclk_multiple: 256
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      # Drive both I2S slots. MAX98357A modules may select left, right, or a
      # mono mix in hardware, so duplicating PCM into both slots is robust.
      slot_mode: I2S_SLOT_MODE_STEREO
      slot_mask: I2S_STD_SLOT_BOTH
      ws_width: 16
      pins:
        mclk: -1
        bclk: 15
        ws: 16
        dout: 7
        din: -1

  # INMP441 microphone (I2S0 standard RX, L/R strapped to GND).
  - name: i2s_audio_in
    type: i2s
    role: master
    format: std-in
    config:
      port: 0
      sample_rate_hz: 16000
      mclk_multiple: 256
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_MONO
      slot_mask: I2S_STD_SLOT_BOTH
      ws_width: 16
      pins:
        mclk: -1
        bclk: 5
        ws: 4
        dout: -1
        din: 6

  # KS0606/MSP1541 ST7789 display. GPIO20/21 cannot be used for native USB
  # while the TFT is connected, so the CH340 UART connector is the console.
  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI3_HOST
        data0_io_num: 21
        sclk_io_num: 20
        max_transfer_sz: 115200

  # TFT backlight, active high. Keep it on from initialization because the
  # display on/off API controls ST7789 state rather than LEDC duty.
  - name: ledc_backlight
    type: ledc
    role: none
    config:
      gpio_num: 42
      freq_hz: 5000
      duty: 1023
      duty_resolution: LEDC_TIMER_10_BIT
      output_invert: false
